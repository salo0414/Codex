services:
  redis:
    image: redis:7.4-alpine
    container_name: fitflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting Redis}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
volumes:
  redis_data:
